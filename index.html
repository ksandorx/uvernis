    if(state==='play'&&time>=dur)win();
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;x.globalAlpha=q.l/.6;x.fillStyle=q.c;x.fillRect(q.x-2,q.y-2,4,4)}
  x.globalAlpha=1;
  if(p){
    for(let i=trail.length-1;i>=0;i--){const q=trail[i];q.l-=dt;if(q.l<=0){trail.splice(i,1);continue}x.globalAlpha=q.l/.4*.5;x.beginPath();x.arc(q.x,q.y,p.r*q.l/.4,0,7);x.fillStyle=skinCol(time-(.4-q.l));x.fill()}
    x.globalAlpha=1;
    for(const s of goldStars)drawStar(s.x,s.y,22+Math.sin(s.t*4)*3,s.t);
    for(const q of pw){x.globalAlpha=q.l<1.5?(Math.floor(q.l*8)%2?.3:1):1;x.beginPath();x.arc(q.x,q.y,18,0,7);x.fillStyle='rgba(255,255,255,.1)';x.strokeStyle=PW[q.k][1];x.lineWidth=2;x.fill();x.stroke();
      x.font='22px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(PW[q.k][0],q.x,q.y+1)}
    x.globalAlpha=1;
    for(const b of balls){const col=b.type==='x'&&b.age>3&&Math.floor(b.age*10)%2?'#fff':BCOL[b.type];
      x.globalAlpha=b.f<1?b.f*.6:1;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=b.f<1?0:10;x.fill();x.shadowBlur=0;
      if(b.type==='c'&&b.f>=1){x.fillStyle='#fff';x.beginPath();x.arc(b.x+Math.cos(Math.atan2(p.y-b.y,p.x-b.x))*4,b.y+Math.sin(Math.atan2(p.y-b.y,p.x-b.x))*4,3,0,7);x.fill()}}
    if(state==='play'){
      x.globalAlpha=inv&&Math.floor(inv*10)%2?.3:1;
      if(shield){x.beginPath();x.arc(p.x,p.y,p.r+6,0,7);x.strokeStyle='#4af';x.lineWidth=3;x.stroke()}
      const pc=skinCol(time);x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=pc;x.shadowColor=pc;x.shadowBlur=15;x.fill();x.shadowBlur=0;x.globalAlpha=1;
      const ef=(eff.slow?' ⏳'+eff.slow.toFixed(0):'')+(eff.mag?' 🧲'+eff.mag.toFixed(0):'')+(eff.mini?' 🔹'+eff.mini.toFixed(0):'');
      ui.textContent=mode==='endless'?`♾ Сложность ${dl}   ⏱ ${time.toFixed(1)}   Очки: ${score}${shield?'   🛡':''}${ef}`
        :`Ур. ${level}   ⏱ ${Math.max(0,dur-time).toFixed(1)}   ⭐ ${lvStars}/5   Очки: ${score}${shield?'   🛡':''}${ef}`;
      if(mode!=='endless'){x.fillStyle='#333';x.fillRect(0,0,W,5);x.fillStyle='#3f3';x.fillRect(0,0,W*Math.min(1,time/dur),5);}
    }
  }
  if(state!=='play')ui.textContent='';
  requestAnimationFrame(loop);
}
mainMenu(-1);requestAnimationFrame(loop);

if(!musicOn)document.querySelector('.mbtn').textContent='🔇';
drawTracks();document.getElementById('vs').value=volS;document.getElementById('nick').value=localStorage.getItem('uv_name')||vkName||'Игрок';document.getElementById('vm').value=volM;
</script></body></html>
